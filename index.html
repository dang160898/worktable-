<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โต๊ะทำงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFF3;--panel:#fff;--ink:#15233B;--mute:#5B687C;--line:#D5DBE4;--ok:#1E7F58;--warn:#9A6400;--bad:#C0392B;--tint:#E3E9F1;--side:#15233B;--sidetx:#DCE4F0;--acc:#F2B01E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1826;--panel:#172336;--ink:#E6ECF5;--mute:#93A1B7;--line:#2A3A52;--ok:#4CC38A;--warn:#F0A93B;--bad:#F06A5C;--tint:#22324A;--side:#0A111C}}
:root[data-theme="dark"]{--bg:#0F1826;--panel:#172336;--ink:#E6ECF5;--mute:#93A1B7;--line:#2A3A52;--ok:#4CC38A;--warn:#F0A93B;--bad:#F06A5C;--tint:#22324A;--side:#0A111C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;font-size:16px;line-height:1.5}
.app{display:grid;grid-template-columns:230px 1fr;height:100%}
.side{background:var(--side);color:var(--sidetx);display:flex;flex-direction:column;padding:22px 12px;gap:4px}
.brand{font-size:1.25rem;font-weight:700;color:#fff;padding:0 14px}
.date{font-size:.85rem;padding:0 14px 18px;opacity:.75}
.side button{font:inherit;text-align:left;background:none;border:0;color:inherit;padding:12px 14px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.side button:hover{background:rgba(255,255,255,.07)}
.side button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:500;box-shadow:inset 3px 0 0 var(--acc)}
.badge{background:var(--acc);color:#15233B;font-weight:700;font-size:.8rem;border-radius:99px;min-width:24px;padding:0 7px;text-align:center}
.foot{margin-top:auto;font-size:.78rem;opacity:.6;padding:0 14px}
main{padding:20px;min-height:0;min-width:0;height:100%}
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;height:100%}
.cols>*{min-height:0}
.stack{display:grid;grid-template-rows:1fr 1fr;gap:20px}
.stack>*{min-height:0}
.one{height:100%;max-width:960px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;min-height:0;height:100%}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
h2{font-size:1.05rem;margin:0;font-weight:700}
.body{flex:1;overflow:auto;min-height:0}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-size:1.9rem;font-weight:700;line-height:1.2}
.ok{color:var(--ok)}
.sub{color:var(--mute);font-size:.92rem}
.track{height:8px;background:var(--tint);border-radius:3px;margin:8px 0 12px;overflow:hidden}
.fill{height:100%;background:var(--ok);transition:width .3s}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
li input[type=checkbox]{width:20px;height:20px;flex:none;cursor:pointer}
.tx{flex:1;min-width:0}
li.done .tx{text-decoration:line-through;color:var(--mute)}
.tm{font-variant-numeric:tabular-nums;background:var(--tint);border-radius:4px;padding:0 7px;font-size:.9rem}
.tm.late{color:var(--bad);font-weight:700}
.tag{font-size:.78rem;border:1px solid var(--line);color:var(--mute);border-radius:4px;padding:0 6px;white-space:nowrap}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.x{font:inherit;font-size:.82rem;background:none;border:0;color:var(--mute);cursor:pointer;padding:2px 6px;border-radius:4px}
.x:hover{color:var(--bad)}
.empty{color:var(--mute);padding:14px 0}
.add{display:flex;gap:8px;align-items:center;padding-top:12px;flex-wrap:wrap}
input[type=text],input[type=time]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-height:40px}
.add .grow{flex:1;min-width:160px}
.chk{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--mute);white-space:nowrap}
.btn{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:6px 16px;min-height:40px}
.btn.ghost{background:none;color:var(--mute);border-color:var(--line);min-height:34px;padding:2px 12px;font-size:.85rem}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 6px 6px 8px}
.tile a{display:flex;align-items:center;gap:10px;flex:1;min-width:0;color:var(--ink);text-decoration:none;padding:4px 0}
.tile a:hover span{text-decoration:underline}
.tile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:34px;height:34px;border-radius:6px;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
@media (max-width:820px){html,body{height:auto;overflow:auto}.app{grid-template-columns:1fr;height:auto}.side{flex-direction:row;flex-wrap:wrap;padding:12px}.foot,.date{display:none}main{height:auto}.cols{grid-template-columns:1fr;height:auto}.stack{grid-template-rows:auto}.panel{height:auto;min-height:320px}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="เมนูหลัก">
    <div class="brand">โต๊ะทำงาน</div>
    <div class="date" id="date"></div>
    <button data-v="home">หน้าหลัก</button>
    <button data-v="tasks">งานวันนี้ <span class="badge" id="nb"></span></button>
    <button data-v="web">ลิงค์เว็บบริษัท</button>
    <button data-v="xls">ไฟล์ Excel ลงข้อมูล</button>
    <div class="foot">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น</div>
  </nav>
  <main id="main"></main>
</div>
<script>
var KEY="desk-v2",view="home",refocus=null;
function $(id){return document.getElementById(id)}
function pad(n){return String(n).padStart(2,"0")}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nowHM(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function mkT(t,time,daily){return{id:uid(),t:t,time:time||"",daily:!!daily,done:false,added:today()}}
function mkL(n,u){return{id:uid(),n:n,u:u}}
function seed(){return{day:today(),
 tasks:[mkT("เช็กไลน์ผลิตก่อนเริ่มกะ","08:00",1),mkT("คีย์โอทีพนักงานรายวัน","16:00",1),mkT("สรุปงานเสียส่งหัวหน้าฝ่าย","17:00",1)],
 web:[mkL("ระบบผลิต (ตัวอย่าง)","https://example.com"),mkL("ระบบบุคคล (ตัวอย่าง)","https://example.com"),mkL("อีเมลบริษัท (ตัวอย่าง)","https://example.com")],
 xls:[mkL("ยอดผลิตรายวัน (ตัวอย่าง)","https://example.com"),mkL("โอทีพนักงาน (ตัวอย่าง)","https://example.com")]}}
function load(){var s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!s||!s.tasks)s=seed();
 if(s.day!==today()){s.tasks=s.tasks.filter(function(t){return t.daily||!t.done});s.tasks.forEach(function(t){if(t.daily)t.done=false});s.day=today()}
 return s}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cleanUrl(u){u=u.trim();if(!u)return null;
 if(/^(javascript|data|vbscript):/i.test(u))return null;
 if(/^[a-z][a-z0-9+.-]*:\/\//i.test(u)&&!/^https?:\/\//i.test(u))return null;
 return /^https?:\/\//i.test(u)?u:"https://"+u}

$("date").textContent=new Date().toLocaleDateString("th-TH",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

function tasksPanel(){
 var T=S.tasks,d=T.filter(function(t){return t.done}).length,r=T.length-d,now=nowHM(),td=today();
 var L=T.slice().sort(function(a,b){if(a.done!==b.done)return a.done?1:-1;var x=a.time||"99:99",y=b.time||"99:99";return x<y?-1:x>y?1:0});
 var li=L.map(function(t){var late=!t.done&&t.time&&t.time<now;
  return '<li class="'+(t.done?"done":"")+'"><input type="checkbox" data-done="'+t.id+'"'+(t.done?" checked":"")+' aria-label="ทำเสร็จแล้ว">'+
  (t.time?'<span class="tm'+(late?" late":"")+'">'+t.time+'</span>':'')+
  '<span class="tx">'+esc(t.t)+'</span>'+
  (late?'<span class="tag bad">เลยเวลา</span>':'')+
  (t.daily?'<span class="tag">ประจำวัน</span>':(t.added!==td&&!t.done?'<span class="tag warn">ค้างมา</span>':''))+
  '<button class="x" data-del="'+t.id+'" aria-label="ลบงาน">ลบ</button></li>'}).join("");
 var stat=T.length===0?'<span class="big">ยังไม่มีงานวันนี้</span>':r===0?'<span class="big ok">เสร็จครบแล้ว</span>':'<span class="big">เหลือ '+r+' อย่าง</span>';
 var canClear=T.some(function(t){return t.done&&!t.daily});
 return '<section class="panel"><div class="ph"><h2>งานวันนี้</h2>'+(canClear?'<button class="btn ghost" data-clear="1">ล้างงานที่เสร็จแล้ว</button>':'')+'</div>'+
 '<div class="stat">'+stat+'<span class="sub">เสร็จแล้ว '+d+' จาก '+T.length+'</span></div>'+
 '<div class="track"><div class="fill" style="width:'+(T.length?d/T.length*100:0)+'%"></div></div>'+
 '<div class="body">'+(li?'<ul>'+li+'</ul>':'<div class="empty">พิมพ์งานแรกในช่องด้านล่าง</div>')+'</div>'+
 '<div class="add"><input type="text" id="tt" class="grow" placeholder="เพิ่มงาน เช่น แจ้งทีมเรื่องเปลี่ยนล็อตวัตถุดิบ" aria-label="ชื่องาน" data-enter="addt"><input type="time" id="tm" aria-label="เวลา (ไม่บังคับ)"><label class="chk"><input type="checkbox" id="td">ทำซ้ำทุกวัน</label><button class="btn" data-addt="1">เพิ่มงาน</button></div></section>'}

function linksPanel(g,manage){
 var title=g==="web"?"ลิงค์เว็บบริษัท":"ไฟล์ Excel ลงข้อมูล",A=S[g];
 var tiles=A.map(function(l){var h=0;for(var i=0;i<l.n.length;i++)h=(h*31+l.n.charCodeAt(i))%360;
  return '<div class="tile"><a href="'+esc(l.u)+'" target="_blank" rel="noopener noreferrer"><i class="ic" style="background:hsl('+h+' 45% 36%)">'+esc(l.n.charAt(0))+'</i><span>'+esc(l.n)+'</span></a>'+
  (manage?'<button class="x" data-ldel="'+l.id+'" data-g="'+g+'" aria-label="ลบลิงค์">ลบ</button>':'')+'</div>'}).join("");
 var ph=g==="web"?"ลิงค์เว็บ เช่น intranet.company.com":"ลิงค์ไฟล์ (SharePoint / OneDrive / Google Sheets)";
 return '<section class="panel"><div class="ph"><h2>'+title+'</h2></div><div class="body">'+(tiles?'<div class="tiles">'+tiles+'</div>':'<div class="empty">ยังไม่มีลิงค์</div>')+'</div>'+
 (manage?'<div class="add"><input type="text" id="ln" placeholder="ชื่อที่ต้องการให้แสดง" aria-label="ชื่อลิงค์" data-enter="addl" style="width:200px"><input type="text" id="lu" class="grow" placeholder="'+ph+'" aria-label="ที่อยู่ลิงค์" data-enter="addl"><button class="btn" data-addl="'+g+'">เพิ่มลิงค์</button></div>':'')+'</section>'}

function render(){
 var m=$("main");
 if(view==="home")m.innerHTML='<div class="cols">'+tasksPanel()+'<div class="stack">'+linksPanel("web",false)+linksPanel("xls",false)+'</div></div>';
 else if(view==="tasks")m.innerHTML='<div class="one">'+tasksPanel()+'</div>';
 else m.innerHTML='<div class="one">'+linksPanel(view,true)+'</div>';
 var btns=document.querySelectorAll(".side button[data-v]");
 for(var i=0;i<btns.length;i++)btns[i].classList.toggle("on",btns[i].getAttribute("data-v")===view);
 var r=S.tasks.filter(function(t){return !t.done}).length;
 $("nb").textContent=r;$("nb").style.display=r?"":"none";
 if(refocus&&$(refocus))$(refocus).focus();refocus=null}

document.querySelector(".side").addEventListener("click",function(e){var b=e.target.closest("button[data-v]");if(b){view=b.getAttribute("data-v");render()}});
function findT(id){return S.tasks.filter(function(t){return t.id===id})[0]}
$("main").addEventListener("click",function(e){var el=e.target,v;
 if((v=el.getAttribute("data-done"))){var t=findT(v);if(t){t.done=el.checked;save();render()}return}
 if((v=el.getAttribute("data-del"))){S.tasks=S.tasks.filter(function(t){return t.id!==v});save();render();return}
 if(el.getAttribute("data-clear")){S.tasks=S.tasks.filter(function(t){return !(t.done&&!t.daily)});save();render();return}
 if(el.getAttribute("data-addt")){var txt=$("tt").value.trim();if(!txt){$("tt").focus();return}
  S.tasks.push(mkT(txt,$("tm").value,$("td").checked));save();refocus="tt";render();return}
 if((v=el.getAttribute("data-ldel"))){var g=el.getAttribute("data-g");S[g]=S[g].filter(function(l){return l.id!==v});save();render();return}
 if((v=el.getAttribute("data-addl"))){var n=$("ln").value.trim(),u=cleanUrl($("lu").value);
  if(!n||!u){(n?$("lu"):$("ln")).focus();return}
  S[v].push(mkL(n,u));save();refocus="ln";render()}
});
$("main").addEventListener("keydown",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-enter");
 if(e.key==="Enter"&&k){var b=$("main").querySelector("[data-"+k+"]");if(b)b.click()}});
setInterval(function(){var a=document.activeElement;if(!a||a.tagName!=="INPUT")render()},60000);
render();
</script>
</body>
</html>
